name: integration

on:
  push:
    branches-ignore:
      - main
  pull_request:
    paths:
      - '!.github/ISSUE_TEMPLATE/*'
      - '!docs/*'
      - '!README.md'
      - '!CHANGELOG.md'
      - '!LICENSE'

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v5
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('global.json', 'src/**/*.csproj') }}
      - name: 'Run: Tests, Publish, Pack'
        run: ./build.cmd Tests Publish Pack
        env:
          NuGetApiKey: ${{ secrets.NUGET_API_KEY }}
          CodecovToken: ${{ secrets.CODECOV_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Publish: unit-tests'
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests
          path: output/artifacts/tests-results/unit-tests
      - name: 'Publish: integration-tests'
        uses: actions/upload-artifact@v7
        with:
          name: integration-tests
          path: output/artifacts/tests-results/integration-tests
      - name: 'Publish: unit-test-coverage-report'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage-report
          path: output/artifacts/reports/coverage-report/unit-test-coverage-report
      - name: 'Publish: unit-test-coverage-history-report'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage-history-report
          path: output/artifacts/reports/coverage-history/unit-test-coverage-history-report
      - name: 'Publish: integration-test-coverage-report'
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-coverage-report
          path: output/artifacts/reports/coverage-report/integration-test-coverage-report
      - name: 'Publish: integration-test-coverage-history-report'
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-coverage-history-report
          path: output/artifacts/reports/coverage-history/integration-test-coverage-history-report
      - name: 'Publish: packages'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: output/artifacts/packages
      - name: 'Publish: publish'
        uses: actions/upload-artifact@v7
        with:
          name: publish
          path: output/artifacts/publish